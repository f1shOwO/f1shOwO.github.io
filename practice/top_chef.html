<!DOCTYPE html>
<html lang="en">
<head>
	<title>Lichtenflights</title>	

<style>

.grid{
	display: grid;
	height:100vh;
	grid:
		'menu head' 100px
		'menu main' 1fr
		'foot foot' 100px
		/200px 1fr;
}

.side{
	display: grid;
	grid-area: menu;
	grid:
		'boxa' 1fr
		'boxb' 1fr
		/1fr;
}

#proot{
	grid-area: head;
	background-image: linear-gradient(#002b7f,#ce1126);
	text-align: center;
	font-size: 35px;
	text-decoration-line: underline;
	text-decoration-style: wavy;
	color: white;
}

#derg{
	grid-area: foot;
	background-image: linear-gradient(#002b7f,#ce1126);
	text-align: center;
	font-size: 35px;
	text-decoration-line: underline;
	text-decoration-style: wavy;
	color: white;
}

#jellyfish{
	grid-area: boxa;
	text-align: center;
	background-image: linear-gradient(#002b7f,#5d1f55);
	text-decoration-line: underline;
	text-decoration-style: wavy;
	font-size: 20px;
	color: white;
}

#sergal{
	grid-area :boxb;
	text-align: center;
	background-image: linear-gradient(#5d1f55,#ce1126);
}

</style>
</head>
<body>

<div class="grid">
	<div id="proot">
	<p>Lichtenflights</p>
	</div>
	<div class="side">
		<div id="jellyfish">
		</div>
		<div id="sergal">
		</div>
	</div>
	<div id="derg">
	</div>
</div>

</body>
</html>
